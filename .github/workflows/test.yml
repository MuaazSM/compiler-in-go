name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned so the runner image only changes when we choose to move it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No third-party modules (no go.sum), so there's nothing to cache.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
